<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230071E3'/%3E%3Cpath d='M10 14h10a3 3 0 0 0 0-6 3 3 0 0 0-3 3M8 18h14a3 3 0 0 1 0 6 3 3 0 0 1-3-3M10 22h6' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E"
    />

    <!-- SEO & Social OpenGraph -->
    <meta
      name="description"
      content="AiroG: GenAI urban air-quality assistant helping Indian families make safer daily decisions during winter smog."
    />
    <meta property="og:title" content="AiroG — Clear air, made simple." />
    <meta
      property="og:description"
      content="GenAI urban air-quality assistant helping Indian families make safer daily decisions during winter smog."
    />
    <meta property="og:url" content="https://airog.vercel.app" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AiroG — Clear air, made simple." />
    <meta
      name="twitter:description"
      content="GenAI urban air-quality assistant helping Indian families make safer daily decisions during winter smog."
    />

    <!-- Adaptive Theme Color -->
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- Zero-flash Apple-grade Theme Bootstrap -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('airog_theme') || 'auto';
          var isDark =
            theme === 'dark' ||
            (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <title>AiroG — Clear air, made simple.</title>
  </head>
  <body class="min-h-screen antialiased selection:bg-[#0071E3]/20 selection:text-[#0071E3]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
